name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # Build vía EAS documentado, no ejecutado en este MVP: requiere una cuenta
  # Expo con EXPO_TOKEN configurado como secret del repo. Ver design.md de
  # driver-mobile-app para la justificacion de no correr un build real aqui.
  build:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: EAS Build
        if: ${{ secrets.EXPO_TOKEN != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install -g eas-cli
          eas build --platform all --non-interactive --no-wait
      - name: EAS Build skipped (sin EXPO_TOKEN)
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: echo "EXPO_TOKEN no configurado - build documentado pero no ejecutado en este MVP."
